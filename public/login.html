<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#15171c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>登录 · pi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b9cf8'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='white' font-family='sans-serif'%3E%CF%80%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#15171c; --bg2:#1b1e25; --bg3:#23272f; --line:#2c313b;
  --fg:#e6e8ec; --fg2:#9aa1ad; --fg3:#6b7280;
  --acc:#5b9cf8; --err:#f85149; --ok:#3fb950;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(1200px 600px at 50% -10%, #1e2633 0%, var(--bg) 55%);
  color:var(--fg);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Segoe UI",Roboto,sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding:calc(var(--safe-t) + 24px) 22px calc(var(--safe-b) + 24px);
  overscroll-behavior:none;
  min-height:100dvh;
}
.card{
  width:100%;max-width:360px;
  display:flex;flex-direction:column;
  animation:fade .4s ease-out;
}
@keyframes fade{from{opacity:0;transform:translateY(12px)}}

.logo{
  width:64px;height:64px;border-radius:18px;
  background:linear-gradient(135deg,var(--acc),#7c5cf8);
  display:grid;place-items:center;
  font-size:34px;font-weight:600;color:#fff;
  margin:0 auto 18px;
  box-shadow:0 10px 30px -8px rgba(91,156,248,.55);
  font-family:ui-serif,Georgia,serif;
  user-select:none;
}
h1{
  font-size:22px;font-weight:600;margin:0 0 6px;text-align:center;letter-spacing:-.01em;
}
.sub{
  text-align:center;font-size:13px;color:var(--fg3);margin:0 0 28px;
}

.field{position:relative;margin-bottom:12px}
input[type=password],input[type=text]{
  width:100%;padding:14px 46px 14px 15px;
  background:var(--bg3);color:var(--fg);
  border:1px solid var(--line);border-radius:13px;
  font:inherit;font-size:16px;   /* ≥16px 防 iOS 自动放大 */
  outline:none;
  transition:border-color .15s, background .15s;
}
input:focus{border-color:var(--acc);background:#262b35}
input::placeholder{color:var(--fg3)}
.eye{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:36px;height:36px;border:0;background:none;color:var(--fg3);
  display:grid;place-items:center;cursor:pointer;border-radius:9px;
}
.eye:active{background:#2f3542}

button.submit{
  width:100%;padding:14px;margin-top:8px;
  border:0;border-radius:13px;
  background:linear-gradient(135deg,var(--acc),#4171d6);
  color:#fff;font:inherit;font-size:15.5px;font-weight:600;
  cursor:pointer;
  transition:opacity .15s, transform .1s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:50px;
}
button.submit:active{transform:scale(.985)}
button.submit:disabled{opacity:.55;cursor:not-allowed}
.spin{
  width:15px;height:15px;border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;border-radius:50%;
  animation:sp .7s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}

.msg{
  margin-top:14px;padding:11px 14px;border-radius:11px;
  font-size:13px;line-height:1.5;
  display:none;
  white-space:pre-wrap;word-break:break-word;
}
.msg.show{display:block;animation:shake .3s}
.msg.err{background:#2a1717;border:1px solid #5a2a2a;color:#ffb3ad}
.msg.ok{background:#16211a;border:1px solid #2c5a35;color:#7ee787}
.msg.warn{background:#26200f;border:1px solid #5a4a1a;color:#e3c169}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  75%{transform:translateX(6px)}
}

.foot{
  margin-top:26px;text-align:center;font-size:11.5px;color:var(--fg3);line-height:1.7;
}
.foot a{color:var(--fg2);text-decoration:none}
</style>
</head>
<body>

<div class="card">
  <div class="logo">π</div>
  <h1>pi mobile</h1>
  <p class="sub" id="sub">输入访问密码以继续</p>

  <form id="form" autocomplete="on">
    <div class="field">
      <input id="pw" type="password" name="password" placeholder="访问密码"
             autocomplete="current-password" autocapitalize="off" spellcheck="false"
             enterkeyhint="go" autofocus>
      <button class="eye" type="button" id="eye" aria-label="显示密码">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
    <button class="submit" type="submit" id="btn">登录</button>
  </form>

  <div class="msg" id="msg"></div>

  <div class="foot">
    密码即服务器上的 <code>PI_MOBILE_TOKEN</code><br>
    会话有效期 30 天
  </div>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const form = $('#form'), pw = $('#pw'), btn = $('#btn'), msg = $('#msg'), eye = $('#eye');

const params = new URLSearchParams(location.search);
const next = params.get('next') || '/';
if (params.get('expired')) show('err', '会话已过期，请重新登录');

// 防开放重定向：只允许站内相对路径
const safeNext = (() => {
  try {
    if (!next.startsWith('/') || next.startsWith('//')) return '/';
    return next;
  } catch { return '/'; }
})();

function show(kind, text) {
  msg.className = 'msg show ' + kind;
  msg.textContent = text;
}
function hide() { msg.className = 'msg'; msg.textContent = ''; }

let busy = false;
function setBusy(v) {
  busy = v;
  btn.disabled = v;
  btn.innerHTML = v ? '<span class="spin"></span>验证中…' : '登录';
}

// 显示/隐藏密码
let visible = false;
eye.onclick = () => {
  visible = !visible;
  pw.type = visible ? 'text' : 'password';
  eye.style.color = visible ? 'var(--acc)' : 'var(--fg3)';
  pw.focus();
};

form.onsubmit = async (e) => {
  e.preventDefault();
  if (busy) return;
  const val = pw.value.trim();
  if (!val) { show('err', '请输入密码'); pw.focus(); return; }

  setBusy(true);
  hide();
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ password: val }),
      credentials: 'same-origin',
    });
    let data = {};
    try { data = await r.json(); } catch {}
    if (r.ok && data.ok) {
      show('ok', '登录成功，正在进入…');
      location.replace(safeNext);
      return;
    }
    setBusy(false);
    if (r.status === 429) show('warn', data.error || '尝试次数过多，请稍后再试');
    else if (r.status === 401) { show('err', '密码错误'); pw.select(); }
    else show('err', data.error || ('登录失败（' + r.status + '）'));
  } catch (err) {
    setBusy(false);
    show('err', '网络错误，请检查连接后重试');
  }
};

// 输入时清掉错误提示
pw.addEventListener('input', () => { if (msg.classList.contains('err')) hide(); });

// 从登录页返回时若已登录，直接进
(async () => {
  try {
    const r = await fetch('/api/me', { credentials: 'same-origin' });
    if (r.ok) {
      const d = await r.json();
      if (d.authEnabled === false) { location.replace(safeNext); }
    }
  } catch {}
})();
</script>
</body>
</html>
